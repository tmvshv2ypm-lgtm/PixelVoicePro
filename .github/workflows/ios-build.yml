name: Build PixelVoice Pro iOS (.ipa)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile iOS App on macOS Runner
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Build PixelVoicePro (Release - iOS Device)
        run: |
          xcodebuild clean build \
            -project PixelVoicePro.xcodeproj \
            -scheme PixelVoicePro \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned .ipa for Sideloading (AltStore / SideStore / Sideloadly)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/PixelVoicePro.app Payload/
          zip -r PixelVoicePro-Unsigned.ipa Payload

      - name: Upload PixelVoicePro.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelVoicePro-iOS-IPA
          path: PixelVoicePro-Unsigned.ipa
          retention-days: 30
