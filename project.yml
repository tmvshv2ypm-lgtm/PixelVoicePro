name: PixelVoicePro
options:
  bundleIdPrefix: com.pixelvoicepro
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
targets:
  PixelVoicePro:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PixelVoicePro
        excludes:
          - Resources/Info.plist
          - Resources/PixelVoicePro.entitlements
    info:
      path: PixelVoicePro/Resources/Info.plist
    entitlements:
      path: PixelVoicePro/Resources/PixelVoicePro.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixelvoicepro.app
        PRODUCT_NAME: PixelVoicePro
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: PixelVoicePro/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PixelVoicePro/Resources/PixelVoicePro.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
